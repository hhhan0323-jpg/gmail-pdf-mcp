          - "-H"
          - "Authorization: Bearer ea24573cbf0a6c2094f564206ec2f4a33bdb79b92b556aee121d3fc2ffd4be22"
          - "-H"
          - "Content-Type: application/json"
          - "https://gmail-pdf-mcp.mangorock-dcccac4c.eastasia.azurecontainerapps.io/trigger/weekly-export"
        resources:
          cpu: 0.25
          memory: "0.5Gi"
